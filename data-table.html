            </form>
            </p>

            <p>
            <label for="isbnInput">Enter ISBN</label>
            <input name="isbn" id="isbnInput" type="text" placeholder="e.g. 978-..." required>

            <p>
            <label for="genreInput">Enter Book Genre</label>
            <input name="genre" id="genreInput" type="text" placeholder="e.g. Action" required>
            </p>

            <p>
            <button id="submitButton" type=submit value=“submit”> Submit</button>
            </p>

        </form>
    </section>
